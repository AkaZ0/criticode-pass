<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>24-Hour Pass Unlocked</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0B111E;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #10192A;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .shield-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h2 { font-size: 20px; margin: 0 0 8px 0; color: #38BDF8; font-weight: 700; }
    p { font-size: 14px; color: #94A3B8; margin: 0 0 20px 0; line-height: 1.5; }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #34D399;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .instruction-box {
      background: #131E31;
      border: 1px solid #1E293B;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: #E2E8F0;
      line-height: 1.5;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield-icon">🛡️</div>
    <div class="badge">✓ Pass Key Activated</div>
    <h2>Return to Your App</h2>
    <p>Your 24-hour pass has been recorded.</p>
    <div class="instruction-box">
      👉 Press your phone's <strong>Back button</strong> or switch to your application from recent apps to enjoy full access!
    </div>
  </div>
</body>
</html>

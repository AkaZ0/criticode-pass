<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Returning to App...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0B111E;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .spinner {
      border: 4px solid #1E293B;
      border-top: 4px solid #38BDF8;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { font-size: 20px; margin: 0 0 8px 0; color: #F8FAFC; font-weight: 700; }
    p { font-size: 14px; color: #94A3B8; margin: 0 0 24px 0; }
    .btn {
      background: #0284C7;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      display: inline-block;
      transition: background 0.2s;
    }
    .btn:active { background: #0369A1; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Returning to your app...</h2>
  <p>Applying 24-hour pass and reopening application...</p>
  <a id="openBtn" class="btn" href="#">🚀 Tap to Open App</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pkg = params.get('pkg') || 'com.rhmsoft.code';
    const token = params.get('token') || '';

    // Android Intent URI targeted directly to the package
    const intentUrl = "intent://#Intent;package=" + encodeURIComponent(pkg) + ";action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;S.token=" + encodeURIComponent(token) + ";end;";
    
    document.getElementById('openBtn').href = intentUrl;

    // Immediately trigger system browser intent redirection
    window.location.replace(intentUrl);
  </script>
</body>
</html>

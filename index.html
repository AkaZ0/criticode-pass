<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CritiCode Security Enclave — 24-Hour Sponsor Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="CritiCode Runtime Application Self-Protection (RASP) & Sponsor Portal.">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <style>
    :root {
      --bg-deep: #090D14;
      --bg-card: #10192A;
      --border-subtle: #1E293B;
      --accent-cyan: #38BDF8;
      --accent-blue: #0284C7;
      --accent-red: #EF4444;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .enclave-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 28px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .enclave-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(2, 132, 199, 0.18);
      border: 1px solid var(--accent-blue);
      color: #E0F2FE;
      margin-bottom: 14px;
    }
    .enclave-card h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }
    .enclave-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 16px;
    }
    .spinner {
      border: 3px solid rgba(56, 189, 248, 0.18);
      border-top: 3px solid var(--accent-cyan);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.75s linear infinite;
      margin: 18px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 12px;
      color: var(--accent-cyan);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="enclaveRoot" class="enclave-card">
    <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
    <div class="enclave-badge">ZERO-SOURCE HARDWARE ENCLAVE</div>
    <div class="spinner" id="loadingSpinner"></div>
    <h1 id="enclaveTitle">Decrypting Secure Enclave...</h1>
    <p id="enclaveDesc">Loading sealed RAM bytecode and verifying hardware key hash fragment...</p>
    <div id="enclaveStatus" class="status-text">INITIALIZING RAM DECRYPTION</div>
  </div>

  <script>
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      }
      return bytes;
    }

    function showLockedScreen(reason) {
      const spinner = document.getElementById("loadingSpinner");
      if (spinner) spinner.style.display = "none";
      const title = document.getElementById("enclaveTitle");
      if (title) title.innerText = "Access Restricted";
      const desc = document.getElementById("enclaveDesc");
      if (desc) desc.innerText = reason || "This sponsor portal is protected with zero-source RAM encryption. Please launch from within your CritiCode shielded application to claim your 24-Hour Pass.";
      const status = document.getElementById("enclaveStatus");
      if (status) {
        status.innerText = "STATUS: HARDWARE_KEY_REQUIRED";
        status.style.color = "#EF4444";
      }
    }

    async function bootstrapEnclave() {
      const status = document.getElementById("enclaveStatus");
      try {
        const hash = window.location.hash || "";
        const match = hash.match(/#_k=([0-9a-fA-F]+)\.([0-9a-fA-F]+)\.([0-9a-fA-F]+)/);
        if (!match) {
          showLockedScreen("No authorized session key found in URL hash. Launch from within the genuine app.");
          return;
        }

        const keyHex = match[1];
        if (keyHex.length !== 64) {
          showLockedScreen("Invalid enclave key length. Authentication rejected.");
          return;
        }

        if (status) status.innerText = "FETCHING ENCRYPTED ASSET...";
        const resp = await fetch("portal.enc", { cache: "no-store" });
        if (!resp.ok) {
          showLockedScreen("Failed to load encrypted portal assets (" + resp.status + "). Check network.");
          return;
        }

        const buffer = await resp.arrayBuffer();
        if (buffer.byteLength <= 28) {
          showLockedScreen("Corrupted enclave payload.");
          return;
        }

        if (status) status.innerText = "IMPORTING HARDWARE AES KEY...";
        const rawKey = hexToBytes(keyHex);
        const cryptoKey = await window.crypto.subtle.importKey(
          "raw",
          rawKey,
          { name: "AES-GCM" },
          false,
          ["decrypt"]
        );

        if (status) status.innerText = "DECRYPTING RAM PAYLOAD...";
        const iv = new Uint8Array(buffer, 0, 12);
        const ciphertext = new Uint8Array(buffer, 12);

        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          cryptoKey,
          ciphertext
        );

        const html = new TextDecoder().decode(decrypted);

        // Inject decrypted portal directly into document RAM
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        console.error("Enclave bootstrap error:", err);
        showLockedScreen("Hardware key mismatch or decryption failed (" + (err && err.message ? err.message : err) + ").");
      }
    }

    window.addEventListener("DOMContentLoaded", bootstrapEnclave);
  </script>
</body>
</html>
